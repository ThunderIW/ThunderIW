name: My YourTomo cat
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prsdx/github-pet@v1
        with:
          username: ThunderIW
          timezone-offset-minutes: "480"
          accent-color: "#FF2A6D"
          hibernate-until: "2027-04-30"
